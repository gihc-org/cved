[project]
name = "cved"
version = "0.1.0"
description = "CV editor og generator – TOML → PDF/DOCX/ODF"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.27",
    "tomli-w>=1.2.0",
    "uvicorn>=0.46.0",
    "weasyprint>=68.1",
]

[project.scripts]
cved = "main:main"
