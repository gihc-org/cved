_job = "Infrastruktur Specialist - vær med til at forme Norlys' private cloud"
_note = ""
_application = "---\r\ntitle-meta: \"Ansøgning – Infrastruktur Specialist, Norlys\"\r\nauthor-meta: \"Kristian Nygaard Jensen\"\r\nlang: da\r\n---\r\n\r\n**Kristian Nygaard Jensen**\\\r\nKrudttårnsvej 121, 2791 Dragør · 52 69 94 43 · kristian.n.jensen@gmail.com\r\n\r\nAtt.: Bjørn Borup Thomsen, Senior Manager, IT Infrastructure, Norlys\r\n\r\nAnsøgning til stillingen som Infrastruktur Specialist, med fokus på VCF Automation\r\n\r\nKære Bjørn Borup Thomsen\r\n\r\nJeg søger stillingen som infrastrukturspecialist, og af de tre spor kan jeg tydeligst se mig selv i **VCF Automation**. Selvbetjening har fyldt de seneste godt otte år af mit arbejdsliv. Årene før dem var jeg programmør og systemudvikler — altså den, der sad og ventede på, at nogen leverede et miljø. Det er grunden til, at jeg bygger platforme med brugerens utålmodighed i baghovedet.\r\n\r\nI Udviklings- og Forenklingsstyrelsen var jeg med til at bygge en on-prem cloud på Mesos/Marathon, udrullet og vedligeholdt med Ansible. Da platformen skulle videre, fulgte jeg den til AWS med Terraform og derefter til Kubernetes på EKS. Hver gang handlede det om de samme shared services — Jenkins, SonarQube, AD-spejling — og om den samme opgave: at gøre det let for udviklingsteams at komme i luften selv, uden at drift, overvågning og adgangsstyring blev ofret undervejs. Det er præcis den opgave, jeg læser ud af jeres beskrivelse af VCF Automation.\r\n\r\nJeg har også siddet med driften, når den gjorde ondt. Hos JYSK passede jeg Jenkins, AWX og virtuelle maskiner, og hos COOP byggede jeg logging-infrastruktur op med Rancher, Elasticsearch, Kibana og Fluentd. Lige nu bygger jeg i GIHC-regi et Kubernetes-cluster med Ansible og Terraform og udruller Jenkins via JCasC og Helm. Jeg kender derfor forskellen på en platform, der ser rigtig ud på et diagram, og en, der også kan passes en tilfældig onsdag morgen.\r\n\r\nJeg har arbejdet med VMware før. I den første fase hos Udviklings- og Forenklingsstyrelsen kørte vores on-prem platform på VMware, hvor jeg selv oprettede de virtuelle maskiner, vi havde brug for. I begyndelsen installerede vi Ubuntu i hånden på hver enkelt. Det holdt ikke længe: vi satte selv en PXE/TFTP-server op på en af maskinerne, så nye VM'er kom op over netværket uden manuelle trin og med samme udgangspunkt hver gang. I småformat er det præcis den bevægelse, I er i gang med — væk fra håndarbejde, hen mod selvbetjening.\r\n\r\nJeg skal samtidig være ærlig om omfanget: jeg har brugt VMware-platformen, ikke administreret den, og VCF, NSX og SDDC Manager er nyt for mig. Til gengæld er Terraform, Ansible, Bash og pipelines i Jenkins hverdagsværktøjer, og jeg lærer helst en ny platform at kende ved at bygge med den frem for at læse om den.\r\n\r\nEn bemærkning til CV'et: perioden fra 2023 til foråret 2026 skyldes et længere sygdomsforløb, som er afsluttet. Jeg er fuldt arbejdsdygtig i dag, og Kubernetes-arbejdet i GIHC er det, jeg har brugt tiden på siden.\r\n\r\nJeg blev sikkerhedsgodkendt under min ansættelse i Udviklings- og Forenklingsstyrelsen, så både processen og de rammer, den sætter til hverdag, er kendt stof for mig. Fem år med kritisk infrastruktur under høje krav til informationssikkerhed og compliance hører med til samme billede. Rådighedsvagt har jeg ingen indvendinger mod.\r\n\r\nJeg bor i Dragør og tænker København som base, men jeg kommer gerne til Aarhus, Silkeborg, Aalborg eller Esbjerg, når det giver mening for teamet.\r\n\r\nJeg uddyber meget gerne ved en samtale.\r\n\r\nMed venlig hilsen\\\r\nKristian Nygaard Jensen"

