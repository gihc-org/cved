[summary]
text = "Jeg arbejder med DevOps og platformsdrift med fokus på automatisering, stabil drift og sikkerhed. Jeg har bygget og fulgt den samme platform hele vejen — fra en on-prem cloud på VMware og Mesos/Marathon udrullet med Ansible, over AWS med Terraform, til Kubernetes — altid med Infrastructure as Code som omdrejningspunkt. Mit fokus er at give udviklingsteams selvbetjening, de kan bruge uden at vente på nogen, og som samtidig kan overvåges, adgangsstyres og driftes i miljøer med høje krav til compliance og informationssikkerhed. Jeg motiveres af at lære nye platforme at kende ved at bygge med dem."

[about]
text = "Jeg er en god kollega, der både på mindre og større arbejdspladser og projekter sætter en ære i at bidrage med godt humør og tage ansvar for, at alle kommer med, selvom der skal løbes stærkt. Min fritid går med mine børn og friluftsliv - meget gerne kombineret."

