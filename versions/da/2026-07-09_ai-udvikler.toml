_job = "AI-udvikler"
_note = ""
_application = "Kære Lars Vraa\r\n\r\nJeg søger stillingen som AI-udvikler hos KOMBIT, fordi jeg ser en spændende mulighed for at kombinere mine mange års erfaring med softwareudvikling, DevOps og cloud-teknologier med den udvikling, der sker inden for generativ AI. Jeg motiveres af at bygge løsninger, der skaber reel værdi, og jeg finder det særligt inspirerende, at KOMBIT arbejder med ansvarlige og sikre AI-løsninger til gavn for kommunerne.\r\n\r\nJeg har omkring 20 års erfaring med softwareudvikling og de seneste godt seks år arbejdet med DevOps og cloud-platforme. Gennem min karriere har jeg udviklet løsninger i blandt andet Java, JavaScript, PHP, Python og C#, samtidig med at jeg har arbejdet intensivt med Linux, Kubernetes, AWS, Terraform, Ansible og CI/CD. Jeg er AWS Certified Solutions Architect – Associate og har stor erfaring med at automatisere deployment, etablere stabile udviklingsplatforme og sikre drift af komplekse it-løsninger.\r\n\r\nJeg har været fastansat i Udviklings- og Forenklingsstyrelsen og har derudover arbejdet med store it-løsninger hos blandt andet COOP, Jysk og Ørsted. Her har jeg været med til at udvikle og drifte samfundskritiske løsninger, etablere Kubernetes-platforme, bygge CI/CD-pipelines og automatisere infrastruktur gennem Infrastructure as Code. Det har givet mig et solidt fundament i at udvikle løsninger, der både er robuste, skalerbare og kan bringes sikkert i produktion.\r\n\r\nDet, der særligt tiltrækker mig ved denne stilling, er muligheden for at arbejde med AI som en integreret del af softwareudviklingen. Jeg følger udviklingen inden for generativ AI tæt og anvender allerede AI-værktøjer aktivt i mit daglige udviklingsarbejde til analyse, design, kodning, test og dokumentation. Blandt andet har jeg opbygget et Git pre-commit hook, som automatisk sender ændringerne (diffen) til Claude sammen med et sæt udviklingsretningslinjer. På den måde får jeg valideret, at krav til dokumentation, test og kodekvalitet er opfyldt, inden ændringerne committes. Jeg ser AI som en samarbejdspartner, der kan være med til at hæve kvaliteten og understøtte en mere effektiv udviklingsproces – uden at gå på kompromis med faglighed eller ansvarlighed.\r\n\r\nJeg trives i tværfaglige miljøer, hvor udviklere, arkitekter og forretningen arbejder tæt sammen om at skabe værdi. Samtidig sætter jeg pris på en kultur med høj faglighed, videndeling og løbende læring – noget jeg oplever kendetegner KOMBITs AI-satsning.\r\n\r\nEfter en periode væk fra arbejdsmarkedet er jeg nu klar til at vende tilbage med fornyet energi og stor motivation. Perioden har givet mig nye perspektiver, og jeg ser frem til igen at bidrage med min tekniske erfaring, nysgerrighed og lyst til at lære nyt. Jeg er overbevist om, at min kombination af softwareudvikling, DevOps og praktisk anvendelse af AI vil gøre mig til en værdifuld del af jeres AI core team.\r\n\r\nJeg ser frem til muligheden for at uddybe min motivation og fortælle mere om, hvordan jeg kan bidrage til KOMBITs udvikling af ansvarlige og produktionsklare AI-løsninger.\r\n\r\nMed venlig hilsen\r\n\r\nKristian Jensen"

