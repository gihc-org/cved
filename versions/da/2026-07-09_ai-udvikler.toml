[summary]
text = "Softwareudvikler med omkring 20 års erfaring inden for udvikling af forretningskritiske systemer og de seneste godt seks år med speciale i DevOps, cloud og platforme. Jeg har stor erfaring med Linux, Kubernetes, AWS, Terraform og CI/CD samt med at udvikle løsninger, der er robuste, automatiserede og klar til produktion. Jeg arbejder aktivt med generativ AI som en del af udviklingsprocessen og har blandt andet automatiseret kvalitetssikring gennem Git pre-commit hooks, hvor AI validerer kodeændringer mod krav til dokumentation, test og kodekvalitet. Jeg motiveres af at omsætte ny teknologi til praktiske løsninger, der skaber værdi for både brugere og forretning."

[about]
text = "Jeg er en god kollega, der både på mindre og større arbejdspladser og projekter sætter en ære i at bidrage med godt humør og tage ansvar for, at alle kommer med, selvom der skal løbes stærkt. Min fritid går med mine børn og friluftsliv - meget gerne kombineret."

