_note = ""
_application = "# Ansøgning – Softwareudvikler med stærke Jenkins kompetencer\r\n**Udviklings- og Forenklingsstyrelsen**\r\n\r\nKristian Nygaard Jensen\r\nKrudttårnsvej 121, 1. tv., 2791 Dragør\r\n52699443 · kristian.n.jensen@gmail.com\r\n\r\nDragør, den 18. september 2026\r\n\r\n---\r\n\r\nKære Vanessa Tyndeskov og Claus Just Rasmussen,\r\n\r\nDa jeg så opslaget om en DevOps Operations Engineer med fokus på jeres Jenkins as a Service-platform, kunne jeg ikke lade være med at søge – ikke kun fordi Jenkins og JCasC er noget af det, jeg har arbejdet mest indgående med gennem min karriere, men fordi jeg allerede kender huset. Jeg var chefkonsulent i Udviklings- og Forenklingsstyrelsen fra 2015 til 2020, hvor jeg som en del af ejendomsvurderingsprojektet var med til at drive Jenkins-baseret CI/CD-infrastruktur gennem flere store arkitekturskift. Jeg kender ikke jeres nuværende JaaS-platform i detaljer, men jeg kender udfordringerne ved at holde en Jenkins-platform stabil, når den skal serviceres af mange udviklerteams og følge med infrastrukturens udvikling.\r\n\r\nI den periode var jeg med gennem tre store faser: fra on-prem-drift på Mesos/Marathon med Ansible, til migrering af shared services – herunder Jenkins og SonarQube – til AWS via Terraform, og videre til Kubernetes (EKS). Jeg byggede og vedligeholdt Jenkins-pipelines gennem hele forløbet og fik en solid forståelse for, hvad det kræver at holde en Jenkins-platform stabil og i sync, når infrastrukturen forandrer sig under den.\r\n\r\nSiden har jeg fortsat i samme spor. Hos Cybercom/KnowIT arbejdede jeg blandt andet med logging-infrastruktur og Kubernetes-udrulning (Rancher, AKS) hos COOP og Ørsted, og senest har jeg hos JYSK implementeret og vedligeholdt Jenkins-pipelines, virtuelle maskiner og Docker-images. Jeg er vant til at fejlsøge i maskinrummet – uanset om problemet sidder i en Jenkins Kubernetes-deployment, en Azure VM eller en pipeline-konfiguration, der er kommet ud af trit med git.\r\n\r\nJeres kernekompetencer matcher godt med det, jeg kan byde ind med:\r\n\r\n- **Jenkins og JCasC:** Mange års praktisk erfaring med Jenkins-arkitektur og automatiseret konfiguration som kode, senest hos JYSK. Langt størstedelen af mine Jenkins-pipelines er skrevet i Groovy, herunder Jenkinsfiles og shared libraries.\r\n- **Kubernetes og Docker:** Erfaring med Rancher, AKS og EKS samt opbygning af container-images gennem hele min karriere.\r\n- **Infrastruktur og cloud:** Solid baggrund i drift og fejlfinding af Linux-servere, både on-prem og i cloud (AWS, Azure).\r\n- **Git/GitHub og CI/CD:** Automatisering af deployment-pipelines går som en rød tråd gennem næsten alle mine roller.\r\n- **Sikkerhed og adgangsstyring:** Erfaring med firewall-regler, security groups og drift i miljøer med høje krav til compliance – praktiseret netop i Skatteforvaltningen.\r\n- **JVM-økosystemet:** Selvom mine programmeringsopgaver i Java primært stammer fra studietiden, har jeg solid praktisk erfaring med JVM'en og JDK i produktion – bl.a. opbygning af Docker-images og build/deploy-pipelines til Java hos JYSK, samt til Clojure (som også kører på JVM'en) hos Udviklings- og Forenklingsstyrelsen.\r\n\r\nJeg har derudover erfaring som mentor for nyansatte og studentermedhjælpere, hvilket jeg ser som en naturlig del af rollen i en afdeling, der samler både erfarne og nyuddannede specialister.\r\n\r\nJeg vil meget gerne bidrage til, at jeres JaaS-platform fortsat er stabil og robust for de mange interne udviklere, der er afhængige af den, og jeg ser frem til at høre mere om stillingen.\r\n\r\nMed venlig hilsen\r\nKristian Nygaard Jensen"

